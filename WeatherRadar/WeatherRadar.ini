[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=20,28,38,230
BackgroundColor=20,28,38,230
@Include=#@#Settings.inc
MouseOverAction=[!SetOption MeterEdit Text "Set location..."][!UpdateMeter MeterEdit][!Redraw]
MouseLeaveAction=[!SetOption MeterEdit Text "Edit location"][!UpdateMeter MeterEdit][!Redraw]

[Metadata]
Name=Windows 11 Weather Radar
Author=GitHub Copilot
Information=Simple Rainmeter weather widget for Berlin with Open-Meteo data and configurable location.
Version=1.0
License=MIT

[Variables]
FontName=Segoe UI
FontColor=255,255,255,255
AccentColor=0,174,255,255
TitleFontSize=12
TempFontSize=34
TextFontSize=11
SmallFontSize=9

[MeasureWeatherTemp]
Measure=Plugin
Plugin=WebParser
Url=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current_weather=true&daily=precipitation_probability_max,precipitation_sum&timezone=Europe/Berlin
RegExp="temperature":([0-9.+-]+)
StringIndex=1
UpdateRate=#UpdateInterval#
DynamicVariables=1

[MeasureWeatherCode]
Measure=Plugin
Plugin=WebParser
Url=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current_weather=true&daily=precipitation_probability_max,precipitation_sum&timezone=Europe/Berlin
RegExp="weathercode":([0-9]+)
StringIndex=1
UpdateRate=#UpdateInterval#
DynamicVariables=1

[MeasurePrecipProb]
Measure=Plugin
Plugin=WebParser
Url=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current_weather=true&daily=precipitation_probability_max,precipitation_sum&timezone=Europe/Berlin
RegExp="precipitation_probability_max":\[([0-9]+)\]
StringIndex=1
UpdateRate=#UpdateInterval#
DynamicVariables=1

[MeasurePrecipSum]
Measure=Plugin
Plugin=WebParser
Url=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current_weather=true&daily=precipitation_probability_max,precipitation_sum&timezone=Europe/Berlin
RegExp="precipitation_sum":\[([0-9.+-]+)\]
StringIndex=1
UpdateRate=#UpdateInterval#
DynamicVariables=1

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,320,180,10 | Fill Color 20,28,38,230 | StrokeWidth 0

[MeterLocation]
Meter=String
MeasureName=MeasureWeatherTemp
FontFace=#FontName#
FontSize=#TitleFontSize#
FontColor=#FontColor#
Text=#LocationName#
X=20
Y=20
DynamicVariables=1

[MeterWeatherIcon]
Meter=String
FontFace=Segoe UI Emoji
FontSize=30
FontColor=#AccentColor#
Text=[MeasureWeatherCode]
Substitute="0":"☀️","1":"🌤","2":"⛅","3":"☁️","45":"🌫","48":"🌫","51":"💧","53":"💧","55":"🌧","56":"🌧","57":"🌧","61":"🌦","63":"🌦","65":"🌧","66":"❄️","67":"❄️","71":"❄️","73":"❄️","75":"❄️","77":"❄️","80":"🌦","81":"⛈","82":"⛈","85":"❄️","86":"❄️","95":"⛈","96":"⛈","99":"⛈"
X=20
Y=48
DynamicVariables=1

[MeterTemperature]
Meter=String
MeasureName=MeasureWeatherTemp
FontFace=#FontName#
FontSize=#TempFontSize#
FontColor=#FontColor#
Text=[MeasureWeatherTemp]°C
X=70
Y=50
DynamicVariables=1

[MeterCondition]
Meter=String
FontFace=#FontName#
FontSize=#TextFontSize#
FontColor=#FontColor#
Text=[MeasureWeatherCode]
Substitute="0":"Clear","1":"Mainly Clear","2":"Partly Cloudy","3":"Overcast","45":"Fog","48":"Fog","51":"Drizzle","53":"Drizzle","55":"Rain","56":"Freezing Drizzle","57":"Freezing Drizzle","61":"Rain","63":"Rain","65":"Heavy Rain","66":"Freezing Rain","67":"Freezing Rain","71":"Snow","73":"Snow","75":"Snow","77":"Snow Grains","80":"Rain Showers","81":"Heavy Rain Showers","82":"Violent Rain Showers","85":"Snow Showers","86":"Snow Showers","95":"Thunderstorm","96":"Thunderstorm with Hail","99":"Thunderstorm with Hail"
X=20
Y=100
DynamicVariables=1

[MeterPrecip]
Meter=String
FontFace=#FontName#
FontSize=#TextFontSize#
FontColor=#FontColor#
Text=Rain chance [MeasurePrecipProb]%% · [MeasurePrecipSum] mm today
X=20
Y=124
DynamicVariables=1

[MeterEdit]
Meter=String
FontFace=#FontName#
FontSize=#SmallFontSize#
FontColor=#AccentColor#
Text=Edit location
X=20
Y=152
LeftMouseUpAction=[!EditVariables "#@#Settings.inc"]
DynamicVariables=1
